<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity & Workload Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1d4ed8',
                        secondary: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col md:flex-row">

    <!-- Mobile Header -->
    <header class="bg-primary text-white p-4 flex justify-between items-center md:hidden shadow-md">
        <h1 class="text-lg font-bold">Activity Tracker</h1>
        <button onclick="toggleMobileMenu()" class="p-2 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </header>

    <!-- Sidebar / Navigation -->
    <aside id="sidebar" class="bg-blue-900 text-white w-64 md:block hidden md:sticky md:top-0 h-screen flex-shrink-0 p-6 space-y-6 z-40 transition-all">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white text-primary rounded-xl flex items-center justify-center font-bold text-xl">A</div>
            <div>
                <h2 class="font-bold text-base leading-tight">Activity Tracker</h2>
                <span class="text-xs text-blue-300">ระบบติดตามภาระงาน</span>
            </div>
        </div>
        <nav class="space-y-2">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full text-left px-4 py-2.5 rounded-lg bg-blue-800 transition flex items-center space-x-3">
                <span>📊 Dashboard & ปฏิทิน</span>
            </button>
            <button onclick="switchTab('form')" id="btn-form" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-blue-800 transition flex items-center space-x-3">
                <span>📝 บันทึกผู้รับผิดชอบ</span>
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
        <header class="flex justify-between items-center mb-6">
            <h3 id="page-title" class="text-xl md:text-2xl font-bold text-gray-800">Dashboard กิจกรรม</h3>
            
            <!-- ปุ่มเพิ่มกิจกรรม และป้ายระบบภายใน -->
            <div class="flex items-center space-x-3">
                <button onclick="switchTab('form')" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                    <span>+ เพิ่มกิจกรรม</span>
                </button>
                <span class="text-xs md:text-sm text-gray-500 bg-white px-3 py-1.5 rounded-full shadow-sm hidden sm:inline-block">ระบบภายในองค์กร</span>
            </div>
        </header>

        <!-- Tab Dashboard -->
        <section id="tab-dashboard" class="space-y-6">
            <!-- Workload Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="workload-summary">
                <p class="text-gray-500 text-sm col-span-full">กำลังโหลดข้อมูลภาระงาน...</p>
            </div>

            <!-- Calendar Container -->
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-200">
                <div id="calendar" class="w-full"></div>
            </div>
        </section>

        <!-- Tab Form (Add Activity & Responsible) -->
        <section id="tab-form" class="hidden space-y-6 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 max-w-2xl mx-auto">
            <h4 class="text-lg font-bold text-gray-800 border-b pb-3">ฟอร์มบันทึกข้อมูลกิจกรรมและผู้รับผิดชอบ</h4>
            <form id="activityForm" onsubmit="submitForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อกิจกรรม</label>
                    <input type="text" id="activityName" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">หน่วยงาน / แผนก</label>
                    <input type="text" id="department" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่จัดกิจกรรม</label>
                    <input type="date" id="date" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เวลาเริ่ม</label>
                        <input type="time" id="startTime" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เวลาสิ้นสุด</label>
                        <input type="time" id="endTime" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนผู้เข้าร่วม (คน)</label>
                    <input type="number" id="participants" min="0" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ผู้รับผิดชอบหลัก (เลือกจากฐานข้อมูล)</label>
                    <select id="responsible" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:outline-none bg-white">
                        <option value="">-- กำลังโหลดรายชื่อผู้รับผิดชอบ --</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="w-full py-3 bg-primary text-white rounded-xl font-medium hover:bg-blue-900 transition shadow-md">
                    บันทึกข้อมูล
                </button>
            </form>
        </section>
    </main>

    <!-- Modal สำหรับแสดงรายละเอียดกิจกรรม -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 border-b pb-2"></h3>
            <div class="space-y-2 text-sm text-gray-600">
                <p><strong>หน่วยงาน:</strong> <span id="modal-dept"></span></p>
                <p><strong>วันที่:</strong> <span id="modal-date"></span></p>
                <p><strong>เวลา:</strong> <span id="modal-time"></span></p>
                <p><strong>ผู้เข้าร่วม:</strong> <span id="modal-participants"></span> คน</p>
                <p><strong>ผู้รับผิดชอบ:</strong> <span id="modal-responsible" class="text-primary font-medium"></span></p>
            </div>
            <div class="pt-4 border-t flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300 transition text-sm font-medium">ปิด</button>
            </div>
        </div>
    </div>

    <!-- เชื่อมโยงไฟล์ app.js และฟังก์ชันโหลดรายชื่อผู้รับผิดชอบ -->
    <script src="app.js"></script>
    <script>
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        // โหลดรายชื่อผู้รับผิดชอบใส่ Dropdown เมื่อหน้าเว็บเปิดขึ้น
        document.addEventListener('DOMContentLoaded', function() {
            loadUsersToDropdown();
        });

        async function loadUsersToDropdown() {
            if (!API_URL) return;
            try {
                let response = await fetch(`${API_URL}?action=getUsers&_=${new Date().getTime()}`);
                let result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    let select = document.getElementById('responsible');
                    if (!select) return;
                    select.innerHTML = '<option value="">-- เลือกผู้รับผิดชอบ --</option>';
                    result.data.forEach(name => {
                        let opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Error loading users:", error);
            }
        }
    </script>
</body>
</html>
