<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกผู้เข้าร่วมกิจกรรม</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#f97316'
                    }
                }
            }
        }
    </script>
    <!-- FullCalendar สำหรับแสดงผลปฏิทินรูปแบบเดือน -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-primary text-white flex flex-col">
            <div class="p-5 text-xl font-bold border-b border-blue-900">Activity Tracker</div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full text-left px-4 py-2.5 rounded-lg bg-blue-800 transition">📊 Dashboard & ปฏิทิน</button>
                <button onclick="switchTab('form')" id="btn-form" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-blue-800 transition">📝 บันทึกกิจกรรม</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h1 id="page-title" class="text-xl font-semibold text-gray-700">Dashboard กิจกรรม</h1>
                <span class="text-sm text-gray-500">ระบบภายในองค์กร</span>
            </header>

            <main class="p-6">
                <!-- Tab: Dashboard -->
                <div id="tab-dashboard" class="space-y-6">
                    <!-- สรุปภาระงาน (ชั่วโมงสะสม) -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-lg font-medium mb-4 text-gray-700">🏆 สรุปภาระงาน (ชั่วโมงสะสมของผู้รับผิดชอบ)</h2>
                        <div id="workload-summary" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <!-- ข้อมูลจะถูกเติมด้วย JavaScript -->
                        </div>
                    </div>

                    <!-- ปฏิทินรูปแบบเดือน -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <div id="calendar"></div>
                    </div>
                </div>

                <!-- Tab: บันทึกกิจกรรม -->
                <div id="tab-form" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-medium mb-4 text-gray-700">แบบฟอร์มบันทึกข้อมูลกิจกรรม</h2>
                    <form id="activityForm" onsubmit="submitForm(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium">ชื่อกิจกรรม</label>
                            <input type="text" id="activityName" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium">หน่วยงาน</label>
                                <input type="text" id="department" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium">วันที่จัดกิจกรรม</label>
                                <input type="date" id="date" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium">เวลาเริ่ม</label>
                                <input type="time" id="startTime" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium">เวลาสิ้นสุด</label>
                                <input type="time" id="endTime" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium">จำนวนผู้เข้าร่วม (คน)</label>
                                <input type="number" id="participants" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium">ชื่อผู้รับผิดชอบ</label>
                                <input type="text" id="responsible" placeholder="ระบุชื่อ (คั่นด้วยเครื่องหมายจุลภาคหากมีหลายคน)" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full py-3 bg-primary text-white rounded-lg font-medium hover:bg-blue-900 transition">บันทึกข้อมูล</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal แสดงรายละเอียดกิจกรรม -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-xl shadow-lg p-6 space-y-4">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800"></h3>
            <div class="space-y-2 text-sm text-gray-600">
                <p><strong>หน่วยงาน:</strong> <span id="modal-dept"></span></p>
                <p><strong>วันที่:</strong> <span id="modal-date"></span></p>
                <p><strong>เวลา:</strong> <span id="modal-time"></span></p>
                <p><strong>จำนวนผู้เข้าร่วม:</strong> <span id="modal-participants"></span> คน</p>
                <p><strong>ผู้รับผิดชอบ:</strong> <span id="modal-responsible"></span></p>
            </div>
            <div class="flex justify-end pt-4">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded-lg text-gray-700 hover:bg-gray-300 transition">ปิด</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
